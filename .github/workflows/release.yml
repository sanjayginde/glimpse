name: Build & Release

on:
  push:
    branches: [main]
    # Only app code/assets trigger a release — not scripts, docs, or CI config
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
  # PRs get a build-only check (no release) so CI changes can be verified
  pull_request:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
      - "build-macos-app.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # macOS 26 SDK is required to compile the `.buttonStyle(.glass)` branch
    runs-on: macos-26
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build Glimpse.app
        run: ./build-macos-app.sh

      - name: Package
        run: |
          ditto -c -k --keepParent Glimpse.app "Glimpse-${VERSION}.zip"

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: Glimpse-${{ env.VERSION }}
          path: Glimpse-${{ env.VERSION }}.zip

      - name: Create release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "Glimpse-${VERSION}.zip" \
            --target "${GITHUB_SHA}" \
            --title "Glimpse ${VERSION}" \
            --generate-notes

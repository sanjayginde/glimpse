name: Build & Release

on:
  push:
    branches: [main]
    # Only app code/assets trigger a release — not scripts, docs, or CI config
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
  # PRs get a build-only check (no release) so CI changes can be verified
  pull_request:
    paths:
      - "Sources/**"
      - "Resources/**"
      - "Package.swift"
      - "build-macos-app.sh"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # macOS 26 SDK is required to compile the `.buttonStyle(.glass)` branch
    runs-on: macos-26
    env:
      VERSION: 1.0.${{ github.run_number }}
    outputs:
      version: ${{ steps.package.outputs.version }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Import signing certificate
        id: signing
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          # Without secrets (e.g. fork PRs) fall back to an ad-hoc build
          if [ -z "${MACOS_CERT_P12}" ]; then
            echo "::warning::No signing secrets; building ad-hoc signed"
            exit 0
          fi
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "${MACOS_CERT_P12}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 3600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${RUNNER_TEMP}/cert.p12" -k "${KEYCHAIN}" \
            -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          rm -f "${RUNNER_TEMP}/cert.p12"

          IDENTITY=$(security find-identity -v -p codesigning "${KEYCHAIN}" \
            | sed -nE 's/.*"(Developer ID Application: [^"]+)".*/\1/p' | head -1)
          if [ -z "${IDENTITY}" ]; then
            echo "::error::No Developer ID Application identity in MACOS_CERT_P12"
            exit 1
          fi
          echo "identity=${IDENTITY}" >> "$GITHUB_OUTPUT"

          echo "${NOTARY_KEY_P8}" > "${RUNNER_TEMP}/notary_key.p8"

      - name: Build Glimpse.app
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          NOTARY_KEY_PATH: ${{ runner.temp }}/notary_key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        # Empty SIGN_IDENTITY falls back to ad-hoc in the script
        run: |
          if [ -n "${SIGN_IDENTITY}" ]; then
            ./build-macos-app.sh --notarize
          else
            ./build-macos-app.sh
          fi

      - name: Clean up signing keychain
        if: always() && steps.signing.outputs.identity != ''
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
          rm -f "${RUNNER_TEMP}/notary_key.p8"

      - name: Package
        id: package
        run: |
          ditto -c -k --keepParent Glimpse.app "Glimpse-${VERSION}.zip"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "Glimpse-${VERSION}.zip" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: Glimpse-${{ env.VERSION }}
          path: Glimpse-${{ env.VERSION }}.zip

      - name: Create release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "Glimpse-${VERSION}.zip" \
            --target "${GITHUB_SHA}" \
            --title "Glimpse ${VERSION}" \
            --generate-notes

  update-tap:
    needs: release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release.outputs.version }}
      SHA256: ${{ needs.release.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: sanjayginde/homebrew-tap
          # Fine-grained PAT with Contents: read & write on sanjayginde/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Bump cask
        id: bump
        run: |
          # Re-runs of an older job must not roll the cask back to a stale version
          CURRENT=$(sed -nE 's/^  version "(.*)"/\1/p' Casks/glimpse.rb)
          NEWEST=$(printf '%s\n%s\n' "${CURRENT}" "${VERSION}" | sort -V | tail -1)
          if [ "${VERSION}" == "${CURRENT}" ] || [ "${NEWEST}" != "${VERSION}" ]; then
            echo "::notice::Cask is at ${CURRENT}; skipping ${VERSION}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sed -i -E \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA256}\"/" \
            Casks/glimpse.rb
          git diff

      - name: Push
        if: steps.bump.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "glimpse ${VERSION}"
          git push
